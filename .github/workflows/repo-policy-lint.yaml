name: Repo policy lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools from mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: actionlint
        run: actionlint

      - name: zizmor
        run: zizmor --offline .github/workflows/

      - name: shellcheck
        run: shellcheck .claude/hooks/*.sh

      - name: gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            range="$BASE_SHA..$HEAD_SHA"
          else
            range="$BEFORE_SHA..$AFTER_SHA"
          fi
          gitleaks git . --log-opts="$range" --redact --exit-code 1

      - name: Check agent policy
        run: python3 scripts/check-agent-policy.py

      - name: Test agent hooks
        run: python3 scripts/test-agent-hooks.py
