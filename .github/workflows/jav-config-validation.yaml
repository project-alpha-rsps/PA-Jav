name: Jav config validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Jav configs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate desktop config
        run: python3 scripts/validate-jav-config.py jav_config.ws

      - name: Validate mobile config
        run: python3 scripts/validate-jav-config.py jav_config_mobile.ws

      - name: Test synthetic syntax and compatibility fixtures
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check out canonical release-manifest validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: project-alpha-rsps/server
          ref: 0a205b8bd9f352b90e6e970e2660a42e9c50224b
          path: .manifest-validator
          persist-credentials: false

      - name: Generate and validate immutable config candidate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_ID: pa-jav-${{ github.event.pull_request.head.sha || github.sha }}
          VALIDATION_URI: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/create-jav-candidate.py \
            --source-sha "$CANDIDATE_SHA" \
            --rollback-sha 004b007b785b342dcc7c738019963690ae2ae21e \
            --candidate-id "$CANDIDATE_ID" \
            --evidence-uri "$VALIDATION_URI" \
            --run-id "$GITHUB_RUN_ID" \
            --builder github-actions \
            --output "$RUNNER_TEMP/jav-candidate.json"
          python3 .manifest-validator/tools/release-manifest/v1/validate.py "$RUNNER_TEMP/jav-candidate.json"

      - name: Report scope
        if: always()
        run: |
          {
            echo '## Jav config validation'
            echo '- Desktop and mobile config syntax plus client startup fields are validated.'
            echo '- Synthetic fixtures cover valid desktop/mobile variants, malformed parameter syntax, missing required fields, and incompatible codebase URLs.'
            echo '- Candidate records pin the source SHA, both config hashes, client-config compatibility evidence, and prior config artifacts; the canonical server manifest validator checks the record.'
            echo '- Candidate generation and validation do not publish config files or assert consumer startup.'
            echo '- This check does not launch the client or verify live endpoint behavior.'
          } >> "$GITHUB_STEP_SUMMARY"
